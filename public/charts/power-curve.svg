<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400"
     width="760" height="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img">
  <rect width="760" height="400" fill="#fafaf8"/>
  <text x="32" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="600"
        fill="#1c1917">Stock 390 W is the worst setting on the card</text>
  <text x="32" y="60" font-size="13" fill="#78716c">3 runs per point, 500 tokens, temperature 0 — throughput vs efficiency</text>
  <line x1="78" y1="254.5" x2="700" y2="254.5" stroke="#e7e5e0" stroke-width="1"/>
  <text x="68" y="258.5" font-size="11.5" fill="#a8a29e" text-anchor="end">50</text>
  <line x1="78" y1="203.0" x2="700" y2="203.0" stroke="#e7e5e0" stroke-width="1"/>
  <text x="68" y="207.0" font-size="11.5" fill="#a8a29e" text-anchor="end">55</text>
  <line x1="78" y1="151.5" x2="700" y2="151.5" stroke="#e7e5e0" stroke-width="1"/>
  <text x="68" y="155.5" font-size="11.5" fill="#a8a29e" text-anchor="end">60</text>
  <line x1="78" y1="100.0" x2="700" y2="100.0" stroke="#e7e5e0" stroke-width="1"/>
  <text x="68" y="104.0" font-size="11.5" fill="#a8a29e" text-anchor="end">65</text>
  <text x="710" y="278.3" font-size="11.5" fill="#a8a29e">180</text>
  <text x="710" y="214.9" font-size="11.5" fill="#a8a29e">200</text>
  <text x="710" y="151.5" font-size="11.5" fill="#a8a29e">220</text>
  <line x1="280.5" y1="92" x2="280.5" y2="306" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="280.5" y="86" font-size="12.5" font-weight="600" fill="#0f766e" text-anchor="middle">the knee</text>
  <polyline points="135.9,139.0 280.5,142.5 352.8,180.8 642.1,274.0" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="6 3"/>
  <polyline points="135.9,243.1 280.5,177.0 352.8,165.9 642.1,141.9" fill="none" stroke="#1c1917" stroke-width="2.5"/>
  <circle cx="135.9" cy="139.0" r="4.5" fill="#fafaf8" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="135.9" cy="243.1" r="5" fill="#1c1917"/>
  <text x="135.9" y="328" font-size="12.5" fill="#78716c" text-anchor="middle">65%</text>
  <text x="135.9" y="345" font-size="11.5" fill="#a8a29e" text-anchor="middle">253 W</text>
  <circle cx="280.5" cy="142.5" r="4.5" fill="#fafaf8" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="280.5" cy="177.0" r="5" fill="#1c1917"/>
  <text x="280.5" y="328" font-size="12.5" fill="#78716c" text-anchor="middle">75%</text>
  <text x="280.5" y="345" font-size="11.5" fill="#a8a29e" text-anchor="middle">292 W</text>
  <circle cx="352.8" cy="180.8" r="4.5" fill="#fafaf8" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="352.8" cy="165.9" r="5" fill="#1c1917"/>
  <text x="352.8" y="328" font-size="12.5" fill="#78716c" text-anchor="middle">80%</text>
  <text x="352.8" y="345" font-size="11.5" fill="#a8a29e" text-anchor="middle">312 W</text>
  <circle cx="642.1" cy="274.0" r="4.5" fill="#fafaf8" stroke="#0d9488" stroke-width="2.5"/>
  <circle cx="642.1" cy="141.9" r="5" fill="#1c1917"/>
  <text x="642.1" y="328" font-size="12.5" fill="#78716c" text-anchor="middle">100%</text>
  <text x="642.1" y="345" font-size="11.5" fill="#a8a29e" text-anchor="middle">390 W</text>
  <text x="68" y="86" font-size="12" font-weight="600" fill="#1c1917" text-anchor="end">tok/s</text>
  <text x="710" y="86" font-size="12" font-weight="600" fill="#0d9488">tok/kJ</text>
  <text x="32" y="382" font-size="13.5" fill="#1c1917">Below 75%, efficiency stops improving <tspan fill="#78716c">(221.6 → 222.7)</tspan> while throughput <tspan font-weight="600" fill="#0f766e">drops another 11%</tspan>.</text>
</svg>
